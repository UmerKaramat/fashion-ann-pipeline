stages:

  prepare:
    cmd: python src/prepare.py
    deps:
     - src/prepare.py
    outs:
     - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
     - src/preprocess.py
     - data/raw
    params:
     - preprocess.test_size
     - preprocess.seed
    outs:
     - data/processed

  train:
    cmd: python src/train.py
    deps:
     - src/train.py
     - data/processed
    params:
     - train.learning_rate
     - train.batch_size
     - train.dropout_rate
     - train.epochs
    outs:
     - models


  evaluate:
    cmd: python src/evaluate.py
    deps:
     - src/evaluate.py
     - data/processed
     - models
    outs:
     - metrics/confusion_matrix.png
    metrics:
     - metrics.json